name: Codeflash

on:
  pull_request:
    paths:
      # So that this workflow only runs when code within the target module is modified
      - 'src/**'
  workflow_dispatch:

concurrency:
  # Any new push to the PR will cancel the previous run, so that only the latest code is optimized
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  optimize:
    name: Optimize new Python code
    # Don't run codeflash on codeflash-ai[bot] commits, prevent duplicate optimizations
    if: ${{ github.actor != 'codeflash-ai[bot]' }}
    runs-on: ubuntu-latest
    env:
      CODEFLASH_API_KEY: ${{ secrets.CODEFLASH_API_KEY }}
    
    steps:
        - name: Checkout
        uses: actions/checkout@v4
        with:
        fetch-depth: 0
        - name: Install apt dependencies
        run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git curl libglib2.0-0 libegl1-mesa-dev ffmpeg libusb-1.0-0-dev speech-dispatcher libgeos-dev portaudio19-dev
        - name: Setup uv and Python
        uses: astral-sh/setup-uv@v6
        with:
        enable-cache: true
        version: '0.8.0'
        python-version: '3.10'
        - name: Create uv virtual environment
        run: uv venv
        - name: Upgrade pip and build tools inside uv
        run: uv pip install --upgrade pip setuptools wheel
        - name: Install Python dependencies from pyproject.toml
      - name: ⚡️Codeflash Optimization
        run: uv run codeflash